name: publish release

on:
  push:
    paths:
      - ".github/workflows/publish-release.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified build packages
        uses: actions/download-artifact@v4
        with:
          name: DYYY
          run-id: 44785905540
          github-token: ${{ github.token }}

      - name: Verify packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=( *.deb )
          if [ "${#debs[@]}" -ne 3 ]; then
            echo "Expected 3 Debian packages, found ${#debs[@]}" >&2
            printf '  %s\\n' "${debs[@]}" >&2
            exit 1
          fi
          for arch in arm arm64 arm64e; do
            matches=( *"_iphoneos-${arch}.deb" )
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one ${arch} package" >&2
              exit 1
            fi
          done
          printf 'Verified release assets:\\n'
          printf '  %s\\n' "${debs[@]}"

      - name: Publish upstream v3.0 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(awk -F': ' '$1 == "Version" { print $2; exit }' control)
          [ "$version" = "3.0.2" ] || { echo "Unexpected package version: $version" >&2; exit 1; }
          gh release view v3.0 >/dev/null 2>&1 && { echo "Release v3.0 already exists" >&2; exit 1; } || true
          gh release create v3.0 *.deb \\
            --target "$(git rev-parse HEAD)" \\
            --title "v3.0" \\
            --notes "适配抖音 41.2.0。

按越狱环境选择安装包：
- `*_iphoneos-arm64e.deb` — roothide
- `*_iphoneos-arm64.deb` — rootless
- `*_iphoneos-arm.deb` — rootful（传统有根）" \\
            --latest
